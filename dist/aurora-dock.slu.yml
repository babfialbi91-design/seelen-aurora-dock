  metadata:
      displayName:
        en: Aurora Dock
        ar: دوك أورورا
      description:
        en: Monochrome black-glass taskbar. Transparent + black with white highlights, a macOS-style magnifying wave (icons grow and push apart) and a compete open/minimize "vacuum" motion. White glowing count badges. Tunable and motion-safe.
        ar: شريط مهام زجاجي أسود أحادي اللون. شفاف وأسود مع لمحات بيضاء، وتكبير حقيقي للأيقونات عند المرور (تنمو وتتباعد مثل الماك)، وحركة فتح/تصغير "شفط". وشارات العدّ بيضاء متوهّجة. قابل للتخصيص ويراعي تقليل الحركة.
      tags:
        - dock
        - taskbar
        - glass
        - monochrome
        - black
        - animation
        - macos
