name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slu:
    name: build and publish .slu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build package
        run: python3 scripts/build-slu.py

      - name: Verify package
        run: |
          test -s dist/aurora-dock.slu
          ls -l dist/aurora-dock.slu

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aurora-dock.slu
          generate_release_notes: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-dock-slu
          path: dist/aurora-dock.slu
          if-no-files-found: error
